[package]
# be a sign or warning of (an imminent event, typically an unwelcome one).
name = "presage"
version = "0.8.0-dev"
authors = ["Gabriel Féron <g@leirbag.net>"]
edition = "2021"
license = "AGPL-3.0-only"

[features]
default = []
# brings libsignal-net and all its dependencies
cdsi = ["libsignal-service/cdsi"]

[dependencies]
libsignal-service = { git = "https://github.com/whisperfish/libsignal-service-rs", rev = "72a098769009923fbe22a79372546ca7773255d4", default-features = false, features = [
    "phonenumber",
] }

base64 = "0.22"
chrono = "0.4"
futures = "0.3"
hex = "0.4.3"
rand = "0.9"
serde = "1.0"
serde_json = "1.0"
sha2 = "0.11.0"
thiserror = "2.0"
tokio = { version = "1.48", default-features = false, features = [
    "rt",
    "sync",
    "time",
] }
tracing = "0.1"
url = "2.5"
derive_more = { version = "2.1.0", features = ["debug"] }
bytes = { version = "1.7.2", features = ["serde"] }
mime = "0.3.17"
regex = "1.12.2"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "system-proxy"] }
scraper = "0.25.0"
percent-encoding = "2"

[dev-dependencies]
quickcheck = "1.0.3"
quickcheck_async = "0.1"
presage-store-sqlite = { path = "../presage-store-sqlite" }
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros"] }
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
axum = { version = "0.8", default-features = false, features = ["tokio", "http1"] }
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
