[package]
# be a sign or warning of (an imminent event, typically an unwelcome one).
name = "presage"
version = "0.8.0-dev"
authors = ["Gabriel Féron <g@leirbag.net>"]
edition = "2021"
license = "AGPL-3.0-only"

[features]
default = []
# brings libsignal-net and all its dependencies
cdsi = ["libsignal-service/cdsi"]

[dependencies]
# Until whisperfish/libsignal-service-rs#473 lands.
libsignal-service = { git = "https://github.com/barafael/libsignal-service-rs", rev = "6d0802aefd5bca9f4585a9d5ec85d41601e292cf", default-features = false, features = [
    "phonenumber",
] }

base64 = "0.22"
chrono = "0.4"
futures = "0.3"
hex = "0.4.3"
rand = "0.9"
serde = "1.0"
serde_json = "1.0"
sha2 = "0.11.0"
thiserror = "2.0"
tokio = { version = "1.48", default-features = false, features = [
    "rt",
    "sync",
    "time",
] }
tracing = "0.1"
url = "2.5"
derive_more = { version = "2.1.0", features = ["debug"] }
bytes = { version = "1.7.2", features = ["serde"] }

[dev-dependencies]
quickcheck = "1.0.3"
quickcheck_async = "0.1"
presage-store-sqlite = { path = "../presage-store-sqlite" }
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros"] }
